{% set u = canonical|urlencode %}{% set tt = it.v.title|urlencode %}
<div class="share" data-url="{{ canonical }}" data-title="{{ it.v.title }}" data-copied="{{ ui.copied }}">
  <button type="button" class="sh-native" aria-label="{{ ui.share }}"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg><span>{{ ui.share }}</span></button>
  <a class="sh" href="https://t.me/share/url?url={{ u }}&text={{ tt }}" target="_blank" rel="noopener" aria-label="Telegram"><svg viewBox="0 0 24 24"><path d="M21 4 3 11l6 2 2 6 3-4 5 4z"/><path d="m9 13 8-6"/></svg></a>
  <a class="sh" href="viber://forward?text={{ tt }}%20{{ u }}" aria-label="Viber"><svg viewBox="0 0 24 24"><path d="M6 3h12a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-6l-5 3v-3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/><path d="M9 8c0 3 2 5 5 5l1-1-2-1-1 1c-1 0-2-1-2-2l1-1-1-2z"/></svg></a>
  <a class="sh" href="https://wa.me/?text={{ tt }}%20{{ u }}" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M4 20l1.3-4A8 8 0 1 1 8 19z"/><path d="M9 9c0 3 3 6 6 6l1-1.5-2-1-1 1c-1-.5-2-1.5-2.5-2.5l1-1-1-2z"/></svg></a>
  <a class="sh" href="https://www.facebook.com/sharer/sharer.php?u={{ u }}" target="_blank" rel="noopener" aria-label="Facebook"><svg viewBox="0 0 24 24"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/></svg></a>
  <a class="sh" href="fb-messenger://share/?link={{ u }}" aria-label="Messenger"><svg viewBox="0 0 24 24"><path d="M12 3C7 3 3 6.6 3 11.2c0 2.6 1.3 4.9 3.3 6.4V21l3-1.7c.9.3 1.8.4 2.7.4 5 0 9-3.6 9-8.3S17 3 12 3z"/><path d="m7 13 3-3 2 2 3-3"/></svg></a>
  <a class="sh" href="https://www.threads.net/intent/post?text={{ tt }}%20{{ u }}" target="_blank" rel="noopener" aria-label="Threads"><svg viewBox="0 0 24 24"><path d="M16.5 11.5c-.5-3-2.5-4.5-5-4.5-3 0-5 2.5-5 5.5S8.5 18 12 18c3 0 5-1.7 5-4.2 0-2-1.6-3.3-4.3-3.3-2 0-3.2 1-3.2 2.3 0 1.2 1 2 2.4 2 2 0 3.1-1.6 3.1-4.3"/><path d="M12 21c-5 0-8.5-3.4-8.5-9S7 3 12 3c4 0 6.7 2 7.7 5.5"/></svg></a>
  <a class="sh" href="https://x.com/intent/post?url={{ u }}&text={{ tt }}" target="_blank" rel="noopener" aria-label="X"><svg viewBox="0 0 24 24"><path d="M4 4l16 16M20 4 4 20"/></svg></a>
  <a class="sh" href="https://www.linkedin.com/sharing/share-offsite/?url={{ u }}" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/></svg></a>
  <a class="sh" href="https://www.reddit.com/submit?url={{ u }}&title={{ tt }}" target="_blank" rel="noopener" aria-label="Reddit"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="14" rx="8" ry="5.5"/><path d="M12 8.5 13 4l4 1"/><circle cx="18" cy="5" r="1.3"/><path d="M9 16c1.8 1.2 4.2 1.2 6 0"/></svg></a>
  {% if it.img %}<a class="sh" href="https://pinterest.com/pin/create/button/?url={{ u }}&media={{ (base ~ it.img)|urlencode }}&description={{ tt }}" target="_blank" rel="noopener" aria-label="Pinterest"><svg viewBox="0 0 24 24"><circle cx="12" cy="11" r="8"/><path d="m10 21 2.5-10M10.5 14c3 1 5.5-1 5.5-4a4 4 0 0 0-8 0c0 1 .3 1.7.8 2.2"/></svg></a>{% endif %}
  <a class="sh" href="mailto:?subject={{ tt }}&body={{ u }}" aria-label="Email"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></a>
  <button type="button" class="sh sh-copy" aria-label="{{ ui.copy_link }}"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
</div>
