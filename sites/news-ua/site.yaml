topic: головні новини України і світу
editorial: Нейтральна подача без оцінок і емоцій. Тільки підтверджені факти, кожну заяву приписуємо джерелу («за даними…»,
  «заявив…»). Не публікуємо чутки, не робимо прогнозів. Не розкриваємо позиції/наслідки ударів, якщо джерело їх не оприлюднило
  офіційно.
