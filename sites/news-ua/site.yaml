# Сайт «Стрічка». Токени соцмереж — тільки назви secret-змінних, самі значення в GitHub Secrets.
# domain: null → працює на strichka-news.pages.dev; коли купимо домен — вписати сюди.
name: Стрічка
pages_project: strichka-news
domain: null
langs:
- uk
- en
topic: головні новини України і світу
editorial: Нейтральна подача без оцінок і емоцій. Тільки підтверджені факти, кожну заяву приписуємо джерелу («за даними…»,
  «заявив…»). Не публікуємо чутки, не робимо прогнозів. Не розкриваємо позиції/наслідки ударів, якщо джерело їх не оприлюднило
  офіційно.
tagline:
  uk: головне за день — коротко й по факту.
  en: Ukraine and world news — short and factual.
